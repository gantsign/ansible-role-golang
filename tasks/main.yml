# code: language=ansible
---
- name: Load source vars
  with_first_found:
    - '../vars/architecture/{{ ansible_facts.architecture | lower }}-{{ ansible_facts.userspace_bits }}.yml'
    - '../vars/architecture/{{ ansible_facts.architecture | lower }}.yml'
    - ../vars/architecture/default.yml
  ansible.builtin.include_vars: '{{ item }}'

# Resolving the version and checksum from the download API keeps the role
# universal: the caller does not have to know which architecture the target
# host is, nor track checksums for it. The checked-in vars/versions/ table
# stays as the offline fallback.
- name: Query the Go download API
  ansible.builtin.uri:
    url: '{{ golang_releases_url }}'
    return_content: true
  register: golang_releases
  until: golang_releases.status | default(0) == 200
  retries: 3
  delay: 5
  check_mode: false
  when: golang_use_download_api | bool
  # An unreachable API is not fatal: the run falls back to vars/versions/ below.
  ignore_errors: true

- name: Resolve version and checksum from the Go download API
  vars:
    _wanted_version: >-
      {{ (golang_releases.json | selectattr('stable') | map(attribute='version') | first | default(''))
         if golang_version == 'latest'
         else 'go' ~ golang_version }}
    _release: >-
      {{ golang_releases.json
         | selectattr('version', 'equalto', _wanted_version)
         | first | default({}) }}
    _archive: >-
      {{ _release.files | default([])
         | selectattr('os', 'equalto', 'linux')
         | selectattr('kind', 'equalto', 'archive')
         | selectattr('arch', 'equalto', golang_architecture)
         | first | default({}) }}
  ansible.builtin.set_fact:
    golang_version_resolved: "{{ _wanted_version | regex_replace('^go', '') }}"
    golang_redis_sha256sum: '{{ _archive.sha256 }}'
  when:
    - golang_use_download_api | bool
    - golang_releases.json is defined
    - _archive.sha256 is defined

- name: Fall back to the pinned version when the download API was not used
  ansible.builtin.set_fact:
    golang_version_resolved: '{{ golang_version }}'
  when: golang_version_resolved is not defined

- name: Assert a concrete version was resolved
  ansible.builtin.assert:
    that:
      - golang_version_resolved not in (None, '', 'latest')
    fail_msg: >-
      Could not resolve golang_version 'latest' for architecture
      '{{ golang_architecture }}' from {{ golang_releases_url }}.
      Pin golang_version to an explicit version (for example '1.26.6') or
      restore network access to the Go download API.

- name: Load version vars
  with_first_found:
    - '../vars/versions/{{ golang_version_resolved }}-{{ golang_architecture }}.yml'
    - '../vars/versions/{{ golang_version_resolved }}.yml'
    - ../vars/versions/default.yml
  ansible.builtin.include_vars: '{{ item }}'
  # include_vars and set_fact write to the same non-persistent fact namespace,
  # so only consult the static table when nothing resolved the checksum already.
  when: golang_redis_sha256sum | default('', true) | length == 0

- name: Assert version vars
  ansible.builtin.assert:
    that:
      - "golang_redis_sha256sum not in (None, '')"
    fail_msg: >-
      No SHA256 checksum available for Go {{ golang_version_resolved }} on
      architecture '{{ golang_architecture }}'. Either the download API is
      unreachable and vars/versions/{{ golang_version_resolved }}-{{ golang_architecture }}.yml
      does not exist, or golang_version points at a release that does not ship
      a linux/{{ golang_architecture }} archive.

- name: Create download directory
  ansible.builtin.file:
    state: directory
    mode: 'u=rwx,go=rx'
    dest: '{{ golang_download_dir }}'

- name: Download Go language SDK
  ansible.builtin.get_url:
    url: '{{ golang_mirror }}/{{ golang_redis_filename }}'
    dest: '{{ golang_download_dir }}/{{ golang_redis_filename }}'
    checksum: 'sha256:{{ golang_redis_sha256sum }}'
    force: false
    use_proxy: true
    validate_certs: true
    mode: 'u=rw,go=r'
  when: not ansible_check_mode

- name: Create Go language SDK installation directory
  become: true
  ansible.builtin.file:
    state: directory
    owner: root
    group: root
    mode: 'u=rwx,go=rx'
    dest: '{{ golang_install_dir }}'

- name: Install unarchive dependencies (zypper)
  become: true
  ansible.builtin.package:
    name:
      - gzip
      - tar
    state: present
  when: ansible_facts.pkg_mgr == 'zypper' and not ansible_check_mode

- name: Install Go language SDK
  become: true
  ansible.builtin.unarchive:
    src: '{{ golang_download_dir }}/{{ golang_redis_filename }}'
    remote_src: true
    extra_opts: '--strip-components=1'
    dest: '{{ golang_install_dir }}'
    owner: root
    group: root
    creates: '{{ golang_install_dir }}/bin'
  when: not ansible_check_mode

# Set Go language SDK environment variables
- name: Make sure /etc/profile.d exists
  become: true
  ansible.builtin.file:
    path: /etc/profile.d
    state: directory
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: Export Go language SDK environment variables
  become: true
  ansible.builtin.template:
    src: golang.sh.j2
    dest: /etc/profile.d/golang.sh
    owner: root
    group: root
    mode: 'u=rw,go=r'

# Set Go language SDK facts
- name: Create Ansible facts.d directory
  become: true
  ansible.builtin.file:
    state: directory
    dest: /etc/ansible/facts.d
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: Install Go language SDK facts
  become: true
  ansible.builtin.template:
    src: facts.j2
    dest: /etc/ansible/facts.d/golang.fact
    owner: root
    group: root
    mode: 'u=rw,go=r'
  when: not ansible_check_mode

- name: Re-read facts
  ansible.builtin.setup:
    filter: ansible_local
